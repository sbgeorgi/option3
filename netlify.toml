# Pretty URLs rewrote every internal .html link to its extension-less form while the canonical tags and sitemap.xml
# say .html, so Google indexed both forms of the same page. Serve links as written; _redirects 301s the other form.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "SAMEORIGIN"
